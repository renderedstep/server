# WHAT HOLDS THE RUST ENGINE TO EACH TEST OF THE RUBY TURN LOOP.
#
# One entry per test in each file that tests the Ruby loop: the behaviour it
# pins, and the check that holds the Rust engine to the same behaviour (`by:`),
# or why none is needed (`obsolete:`), or that nothing holds it yet (`open:`),
# or that the test is not the loop's and outlives it (`stays:`). `partial:`
# says what the counterparts hold more weakly than the Ruby test did.
#
# The loop's tests are deleted with the loop, and only a test whose entry
# names a counterpart or says why none is needed may go:
# test/lib/ruby_loop_coverage_test.rb holds this file to the tests and to the
# counterparts it names (the Rust ones at the pinned engine commit), and says
# what each kind of counterpart is.
test/lib/engine_sweep_physical_actions_test.rb:
  the consumption walk fails if the physical effect leaves the item available:
    pins: a defect planted in the Ruby loop's spending of a consumed thing is caught
      by the consumption script
    obsolete: plants a defect in Ruby code; the script it proves sensitive walks the
      engine in every run, with the same carrying expectation
  the revisit walk fails if a snapshot restores a spent room item:
    pins: a defect planted in the Ruby room snapshot is caught by the consumption
      script's revisit
    obsolete: plants a defect in Ruby code; the script it proves sensitive walks the
      engine in every run, with the same here expectation
  the return walk fails if opening only changes the outward passage:
    pins: a defect planted in the Ruby passage writer is caught by the door script's
      declared arrival
    obsolete: plants a defect in Ruby code; the script it proves sensitive walks the
      engine in every run, and its replay fails on an undeclared call
