quests:
- title: The Bottom of the Dungeon
  premise: |-
    Go down through all ten floors of the dungeon, past the things that keep its stairs, and take the iron crown from Gorrath at the bottom.
  status: open
  contributes: true
  steps:
  - summary: |-
      Take the first stair key from the stairwarden that keeps the stair down from the first floor.
    trigger: hold_item
    target: first stair key
  - summary: |-
      Take the fifth stair key, halfway to the bottom.
    trigger: hold_item
    target: fifth stair key
  - summary: |-
      Take the iron crown from Gorrath at the bottom of the dungeon.
    trigger: hold_item
    target: the iron crown
  outcomes:
  - name: the-bottom-reached
    summary: |-
      The iron crown is in your hands and Gorrath is dead at your feet. You are the first delver in living memory to reach the bottom of the dungeon, and now there is only the long climb back up.
    default: true
  - name: the-bottom-reached-late
    summary: |-
      The iron crown is in your hands at last, but the way down took you more than three days, and the dungeon took its share of you on every floor. You reached the bottom. Nobody on the landing will believe how long it took.
    default: false
    when: slower_than
    minutes: 4320
