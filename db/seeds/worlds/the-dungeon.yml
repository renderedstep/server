# The Dungeon -- a seeded, playable world, version 1.
#
# The dungeon crawler's world: a hand-written landing above ten FLOORS, each a
# stub the engine lays out the first time anybody walks into it (`floor:`,
# `Floor`), as one storey of exactly `rooms` rooms with one of them, never the
# entry, rolled as the way down. Once laid out a floor is world rows, and no
# later game lays it out again.
#
# Three things about it are deliberate:
#
#   1. THE FLOORS SHRINK TO A BOSS. Each floor is smaller than the one above it
#      and the last is one room with no way down (the owner's call C1). Every
#      floor but the last has a stair guard posted to it (`guards:`), stood in
#      its way-down room at layout and carrying the key the stair down is
#      locked with; the last has the boss, stood in its only room.
#   2. THE LIMITS ARE ABOVE WHAT IT CAN USE (call C3): `limits:` lets the dice
#      decide how many people and things a room is born with, so the deep
#      floors are not left empty because the first one used the story up.
#   3. IT IS THE FIRST PLAYABLE SLICE, not the whole game. The floor keys a
#      later stage adds -- the countdown, levelling, placed healing, safe
#      rooms and rest -- are not here, because the loader does not read them
#      yet; a world supplies parameters, and these have no behaviour behind
#      them until those stages land.
#
# The opening scene puts the player and the landing's lamp-keeper together, so
# turn one has somebody to talk to before the first stair.
#
# Loaded offline by db/seeds.rb. No model call, no API key, no network.
---
format: 2
universe:
  physics: |-
    Ordinary physics. The dungeon is cold, still and dark, and sound carries a long way in it.
  technology: |-
    Lanterns, rope, iron keys and hand tools. Nothing in the dungeon runs on anything but muscle and fire.
  weapons: |-
    Short blades, cudgels, spears and hatchets. Delvers carry what they can swing in a narrow passage. The things below use teeth, claws and whatever they took from the last delver.
  geographies: |-
    A dungeon cut straight down into black stone, under a landing at the top of the first stair. Each floor is smaller than the one above it, and every floor but the last has a stair somewhere that goes further down.
  civilizations: |-
    Delvers, who go down for what they can carry back up, and the things that live below and do not want them there. Above the landing there is a town that buys what comes up and does not ask where it came from.
  history: |-
    Nobody knows who cut the dungeon or why. The oldest delvers' stories say the bottom was reached once, a long time ago, and that whoever reached it did not come back up.
  economics: |-
    Coin for what comes up from below. Delvers sell to the town, and the town sells back rope, lamp oil and food at prices that go up the closer you stand to the stair.
  politics: |-
    Nobody governs the dungeon. On the landing the lamp-keeper's word is the only rule, and below it there are no rules at all.
  religion: |-
    Delvers leave a coin on the landing before they go down, for luck, and take one back if they come up. Nobody prays below the first floor.
  races:
  - name: Deepfolk
    description: |-
      Thin, pale people born below, who have never seen daylight and see well in the dark. They take what delvers carry, and they eat what they cannot sell.
    monstrous: true
  - name: Delvers
    description: |-
      People from the town above who go down into the dungeon for a living. Most of them stop after the first floor. The ones who do not are mostly dead.
  - name: Stairwardens
    description: |-
      Grey, heavy, patient things that keep the dungeon's stairs. Each one stands at the head of one stair down and does not leave it. Nobody has ever seen a young one.
    monstrous: true
story:
  title: The Dungeon
  genre: dungeon crawl
  start_time: '2026-11-01T08:00:00Z'
  limits:
    people: 400
    things: 2000
  preface: |-
    The dungeon goes down ten floors, and each one is smaller and worse than the one above it. Every stair down has something standing at the top of it, and at the bottom there is something worse. You have come to the landing with a blade, a lantern and no plan to come back up empty-handed.
  summary: |-
    The player is Ida Marsh, a delver going down into the dungeon from the landing at its top. Each floor has a stair guard who carries the key to the stair down, and the bottom floor has Gorrath, eldest of the deepfolk, who wears the iron crown. The tone is plain, dark and dangerous, and the way on is always down.
opening_scene:
  location: The Landing
  characters: [Ida Marsh, Old Hesk]
  description: |-
    You stand on the landing at the top of the dungeon, a square of black stone under one hanging lamp. The stair down to the first floor opens in the middle of it, and cold air comes up out of the dark. Old Hesk sits on his stool beside the lamp with his hands on his knees, watching you the way he watches every delver who comes this far.
  summary: |-
    The story opens on the landing at the top of the dungeon, with the stair down to the first floor in front of the player and the lamp-keeper watching.
