---
story: A Writ On The Copying Desk
why: >-
  The beat guard (the owner's call of 2026-10-25): while a step of an open
  arc this game has not reached names a thing, the room offers no tear,
  smash or burn of it, and a line asking for one is refused in the engine's
  words, until arcs can branch on a thing being gone. Once the step is
  reached the thing is the player's like any other.
steps:
- id: tear-the-writ-the-story-needs
  why: >-
    The arc's first step asks Tamsin to hold the blank writ, so it is not
    torn, and the refusal says why rather than listing attempts. Played as
    a browser turn, which refuses it the same way and asks no model.
  type: "/tear the blank writ"
  browser:
    token: tear-writ
  expect:
    changed: false
    refused: true
    here:
    - blank writ
    - linen apron
    - glass jar
- id: burn-the-writ-the-story-needs
  why: Nor is it burned, though Tamsin has a tinderbox and the writ burns.
  type: "/burn the blank writ with the tinderbox"
  expect:
    changed: false
    refused: true
    here:
    - blank writ
    - linen apron
    - glass jar
- id: take-the-writ
  why: Taking it reaches the step that named it.
  type: take blank writ
  expect:
    changed: true
    carrying:
    - letter
    - tinderbox
    - clay pot
    - iron key
    - blank writ
- id: tear-the-writ-once-the-step-is-reached
  why: >-
    No open step names the writ now, so it tears like any paper, and the
    arc's last step, the Archive, is still open.
  type: "/tear the blank writ"
  expect:
    changed: true
    refused: false
    carrying:
    - letter
    - tinderbox
    - clay pot
    - iron key
    - scraps of the blank writ
