---
story: A Writ On The Copying Desk
why: >-
  Tearing a thing apart is an act of its own (`divide` in the engine): the
  room offers a `tear` for a thing of paper or cloth in the player's hands
  or lying here, reached through `tear`, `tear up`, `rip` and `rip up`. The
  thing ends (disposition `divided`) and one row of its scraps or strips
  begins where it was, which can be carried, put down or burned like any
  other thing. Paper takes no check; cloth takes strength less two.
steps:
- id: rip-the-apron
  why: >-
    Cloth takes a strength check, less two, thrown on the apron's own row at
    story time. This one fails: a played turn that changes nothing, and the
    apron is whole. The narrator is told it held.
  type: "/rip the linen apron"
  browser:
    token: rip-apron-1
    replies:
    - purpose: narration
      content: You haul at the apron, and the old linen holds.
      prompt_includes:
      - tried to tear the linen apron apart
      - The linen apron held together
  expect:
    refused: false
    resolved_by: grammar
    here:
    - blank writ
    - linen apron
    - glass jar
- id: rip-the-apron-again
  why: >-
    Five minutes on, the check is thrown again, at a later story time, and
    passes: the apron lay on the floor, so its strips lie there now.
  type: "/rip the linen apron"
  browser:
    token: rip-apron-2
    replies:
    - purpose: narration
      content: The seam gives, and the apron comes apart in strips.
      prompt_includes:
      - tore the linen apron apart
      - the strips of the linen apron, lying where it was
  expect:
    changed: true
    refused: false
    here:
    - blank writ
    - strips of the linen apron
    - glass jar
- id: tear-up-the-letter
  why: >-
    Paper tears with no check. The letter was in Tamsin's hands, so the
    scraps are in her hands now, and the letter is nowhere. The narrator is
    told what the tearing left.
  type: "/tear up the letter"
  browser:
    token: tear-letter
    replies:
    - purpose: narration
      content: You tear the letter across, and across again, until it is scraps.
      prompt_includes:
      - tore the letter apart
      - What is left of it is the scraps of the letter, in their hands.
  expect:
    changed: true
    refused: false
    resolved_by: grammar
    carrying:
    - tinderbox
    - clay pot
    - iron key
    - scraps of the letter
- id: the-scraps-are-not-torn-again
  why: >-
    What a tear leaves is not torn again: the room offers no tear of the
    scraps, so the line is refused with the attempts it does offer.
  type: "/tear the scraps of the letter"
  expect:
    changed: false
    refused: true
    carrying:
    - tinderbox
    - clay pot
    - iron key
    - scraps of the letter
- id: burn-the-scraps
  why: >-
    The scraps are paper, so they burn, and burning leaves nothing.
  type: "/burn the scraps of the letter with the tinderbox"
  expect:
    changed: true
    refused: false
    carrying:
    - tinderbox
    - clay pot
    - iron key
