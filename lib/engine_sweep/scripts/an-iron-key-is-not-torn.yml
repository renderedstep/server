---
story: A Writ On The Copying Desk
why: >-
  Only what is possible is offered: a tear of paper or cloth, a smash of
  glass or pottery. A line asking for anything else is refused with the
  attempts the room does offer, and nothing changes.
steps:
- id: tear-the-iron-key
  why: Iron does not tear, so the room offers no tear of the key.
  type: "/tear the iron key"
  expect:
    changed: false
    refused: true
    carrying:
    - letter
    - tinderbox
    - clay pot
    - iron key
- id: smash-the-letter
  why: Paper does not smash, so the room offers no smash of the letter.
  type: "/smash the letter"
  expect:
    changed: false
    refused: true
    carrying:
    - letter
    - tinderbox
    - clay pot
    - iron key
- id: smash-nothing
  why: A smash that names nothing is refused the same way.
  type: "/smash"
  expect:
    changed: false
    refused: true
    here:
    - blank writ
    - linen apron
    - glass jar
