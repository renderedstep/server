# A take with nothing else to tell -- nobody speaks, nothing strikes, nobody
# else acts, no foe, no beat of the arc -- is written in the engine's own
# sentence and asks no narrator. A take of something already carried says so
# by name, or lists what is carried when the name lands on nothing.
story: The Unrecorded Hour
why: the engine tells what it can tell exactly, and calls the narrator only when there is more
steps:
- id: a-plain-take-asks-no-narrator
  type: "/take ward stamp"
  why: no reply is offered, so a narrator call here would fail the step
  browser:
    token: take-the-stamp
  expect:
    changed: true
    refused: false
    understood: take -> ward stamp
    carrying:
    - Ward Office 12 daybook
    - ward stamp
- id: a-take-of-what-is-carried-says-so
  type: Pick up the daybook
  why: the name lands on a carried thing, so the refusal names it
  browser:
    token: take-the-daybook
    replies:
    - purpose: local_classifier
      content:
        intent: take
        target_take: nothing
        named_more_than_one: 0
        target_present: 0.02
  expect:
    changed: false
    refused: true
    offers:
    - You are already carrying the Ward Office 12 daybook.
    carrying:
    - Ward Office 12 daybook
    - ward stamp
- id: a-name-that-matches-nothing-carried-lists-what-is
  type: Pick up the day book
  why: the name lands on nothing, so the offer gains the carried list
  browser:
    token: take-the-day-book
    replies:
    - purpose: local_classifier
      content:
        intent: take
        target_take: nothing
        named_more_than_one: 0
        target_present: 0.02
  expect:
    changed: false
    refused: true
    offers:
    - 'That did not resolve to anything lying here. Lying here: '
    - 'You are already carrying: Ward Office 12 daybook, ward stamp.'
    carrying:
    - Ward Office 12 daybook
    - ward stamp
- id: a-take-with-something-else-to-tell-is-narrated
  type: "/take blank closure writ"
  why: somebody else's act is untold, so the take is not plain and goes to the narrator
  browser:
    token: take-the-writ
    fail: narration
  expect:
    changed: true
    refused: false
    carrying:
    - Ward Office 12 daybook
    - ward stamp
    - blank closure writ
