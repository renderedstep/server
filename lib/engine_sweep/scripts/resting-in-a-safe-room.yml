# A WAIT IN A SAFE ROOM IS A REST. In a sanctuary (`locations.sanctuary`)
# with no foe in it, the `wait` every room offers takes an hour instead of
# five minutes and mends eight hit points, one healing thing's worth, up to
# the player's maximum. The game keeps a row for each rest
# (`playthrough_rests`), which the turn's scene claims and its log entry says
# in the engine's words; no model is told of it. With a foe in the room it is
# a plain five-minute wait and mends nothing. A rest is never refused: one
# that runs past a floor's countdown is played, and the player falls with the
# floor.
story: A Place To Rest
steps:
- id: hurt-on-the-landing
  why: Odile is level 3 on a d8, so 18 hit points; 12 of them are gone.
  type: harm 12
  expect:
    change: Odile unhurt -> badly hurt (6 of 18)
    hp: 6
- id: rest-on-the-landing
  why: >-
    The landing is a safe room the world file names, and nobody is fighting
    Odile: the wait is a rest. It takes an hour and mends eight.
  type: "/wait"
  browser:
    token: rest-on-the-landing
    replies:
    - purpose: narration
      prompt_excludes:
      - rested for an hour
      - hit points
      content: You sit with your back to the wall and let the lantern burn.
  expect:
    elapsed_minutes: 60.0
    hp: 14
    dead: false
- id: rest-again-mends-only-to-her-maximum
  why: A second rest mends only the four she is short of.
  type: "/wait"
  browser:
    token: rest-again
    replies:
    - purpose: narration
      content: You doze, and wake to the same lantern.
  expect:
    elapsed_minutes: 60.0
    hp: 18
- id: into-the-shrine
  type: "/move The Shrine"
  expect:
    location: The Shrine
    present:
    - Brother Amal
- id: strike-the-keeper
  why: Struck, Brother Amal is provoked, and so a foe in the room.
  type: "/attack Brother Amal"
  expect:
    foes:
    - Brother Amal
    hp: 14
    dead: false
- id: a-wait-with-a-foe-here-is-no-rest
  why: >-
    The shrine is a safe room, but somebody in it is fighting Odile: the wait
    is a plain five minutes and mends nothing. The keeper strikes back, for
    four.
  type: "/wait"
  browser:
    token: wait-with-a-foe
    replies:
    - purpose: narration
      content: You hold your ground and watch the old man's cudgel.
  expect:
    elapsed_minutes: 5.0
    hp: 10
    foes:
    - Brother Amal
- id: back-to-the-landing
  why: The keeper strikes once more as she goes, and the fight closes.
  type: "/move The Landing"
  expect:
    location: The Landing
    hp: 5
- id: onto-the-resting-floor
  why: The floor is laid out on this turn; its countdown runs from now.
  type: "/move The Resting Floor"
  browser:
    token: into-the-resting-floor
    realizes: The Resting Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      content:
        description: A low chamber at the foot of the stair.
        lore: Delvers pass through here on their way in.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Resting Floor room 1 (realized)
- id: through-room-2
  type: "/move The Resting Floor room 2"
  browser:
    token: through-room-2
    realizes: The Resting Floor room 2
    replies:
    - purpose: location
      content:
        description: A bare chamber of black stone.
        lore: Delvers do not stop here.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Resting Floor room 2 (realized)
- id: into-the-safe-room
  why: Room 3 is the floor's safe room, laid out so when the floor was.
  type: "/move The Resting Floor room 3"
  browser:
    token: into-the-safe-room
    realizes: The Resting Floor room 3
    replies:
    - purpose: location
      prompt_includes:
      - Write NOBODY into this place.
      content:
        description: A quiet chamber with a dry floor.
        lore: Nothing is born here.
        items: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Resting Floor room 3 (realized)
    hp: 5
    dead: false
- id: rest-past-the-countdown
  why: >-
    The hour runs past the floor's thirty minutes. The rest is not refused:
    it is played, and Odile falls with the floor.
  type: "/wait"
  browser:
    token: rest-past-the-countdown
    replies:
    - purpose: narration
      content: You close your eyes as the stone settles around you.
  expect:
    elapsed_minutes: 60.0
    dead: true
- id: nothing-after
  type: "/wait"
  expect:
    refused: true
    dead: true
    offers: is dead, and this playthrough is over
