# WAITING OUT A FLOOR IS FATAL. The First Floor says `minutes: 30`: the first
# time a game stands on it, its countdown starts, and thirty story minutes on
# the floor gives way in that game. Odile walks onto it and waits there. Each
# wait spends five story minutes, and the wait that carries the clock past
# the countdown is not refused: its time is spent, the floor falls, and she
# falls with it. She is dead and the game is over, so the next line is
# refused in the death statement's words.
story: A Floor That Falls
steps:
- id: onto-the-first-floor
  why: >-
    The floor is laid out on this turn, and this game's countdown on it
    starts as it is reached.
  type: "/move The First Floor"
  browser:
    token: into-the-first-floor
    realizes: The First Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages, cracked across every few paces.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      content:
        description: A low chamber at the foot of the stair, its floor split down the middle.
        lore: Delvers do not rest here long.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 1 (realized)
    dead: false
- id: wait-1
  type: "/wait"
  browser:
    token: wait-1
    replies:
    - purpose: narration
      content: You stand still and listen to the stone settle.
  expect:
    elapsed_minutes: 5.0
    dead: false
- id: wait-2
  type: "/wait"
  browser:
    token: wait-2
    replies:
    - purpose: narration
      content: Grit trickles from a crack overhead.
  expect:
    elapsed_minutes: 5.0
    dead: false
- id: wait-3
  type: "/wait"
  browser:
    token: wait-3
    replies:
    - purpose: narration
      content: The crack in the floor is wider than it was.
  expect:
    elapsed_minutes: 5.0
    dead: false
- id: wait-4
  type: "/wait"
  browser:
    token: wait-4
    replies:
    - purpose: narration
      content: Somewhere further in, something heavy drops.
  expect:
    elapsed_minutes: 5.0
    dead: false
- id: wait-5
  type: "/wait"
  browser:
    token: wait-5
    replies:
    - purpose: narration
      content: The floor shudders under your boots.
  expect:
    elapsed_minutes: 5.0
    dead: false
- id: wait-6
  type: "/wait"
  browser:
    token: wait-6
    replies:
    - purpose: narration
      content: The floor tilts.
  expect:
    elapsed_minutes: 5.0
    dead: true
- id: nothing-after
  type: "/wait"
  expect:
    refused: true
    dead: true
    offers: is dead, and this playthrough is over
