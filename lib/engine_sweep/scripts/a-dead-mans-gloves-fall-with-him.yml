---
story: The Cloakroom at the Ferry
why: >-
  What a dead person wore spills to the floor with what they held, and once
  it lies there nobody wears it: it is picked up and put on like anything
  else lying here, and comes off again before it is let go of.
steps:
- id: round-1
  why: Abel wears his gloves and holds his token; one blow does not kill him.
  type: "/attack Abel Moss"
  expect:
    changed: true
    dead: false
    hp_of:
      Abel Moss: 3
    here:
    - felt hat
    - flat cap
    - hand-bell
- id: round-2
  why: >-
    Abel dies, and the gloves he wore spill to the floor beside the token he
    held.
  type: "/attack Abel Moss"
  expect:
    changed: true
    present: []
    here:
    - brass token
    - felt hat
    - flat cap
    - hand-bell
    - leather gloves
- id: the-gloves-off-the-floor
  why: Gloves lying here are picked up and put on in one act.
  type: "/wear leather gloves"
  expect:
    changed: true
    refused: false
    resolved_by: grammar
    change: You pick up the leather gloves and put them on.
    here:
    - brass token
    - felt hat
    - flat cap
    - hand-bell
    carrying:
    - leather gloves
    - linen shirt
    - oilskin coat
    - wool scarf
- id: worn-gloves-are-not-dropped
  why: A worn thing comes off before it is put down, as an act of its own.
  type: "/drop leather gloves"
  expect:
    refused: true
    offers: You are wearing the leather gloves. Take them off first.
- id: the-gloves-come-off
  type: "/take off the gloves"
  expect:
    changed: true
    change: You take off the leather gloves. They stay in your hands.
    carrying:
    - leather gloves
    - linen shirt
    - oilskin coat
    - wool scarf
