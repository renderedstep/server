# THE DUNGEON, FROM THE LANDING TO THE FIRST STAIR DOWN, the way a player
# walks it. The First Floor is a stub until this walk steps onto it, and that
# step lays it out: exactly the file's count of rooms on one storey, with one
# of them, never the entry, rolled as the way down, and Brask the Stairwarden
# stood in it. The walk then goes room by room along the shortest way from the
# entry to that room -- each one written on first entry from a fixed reply --
# and finds him there, hostile and whole, beside the stair down to The Second
# Floor, which is locked with the key he carries.
#
# THE ROUTE IS THE LAYOUT'S, NOT THE FILE'S. Which room is the way down, and
# which doors join the rooms between, are the floor's own dice (`Roll::INTERIOR`
# of the place), and a walk pins every id (`EngineSweep::Walk::ID_BASE`), so
# the floor lays out the same on every walk. A change to the file's floors, or
# to the engine's floor layout, moves the route, and this script says so on its
# first room that is no longer where it was.
story: The Dungeon
steps:
- id: the-landing
  why: >-
    The game opens on the landing with the lamp-keeper, and the one way on is
    the stair down onto the first floor, a stub nobody has laid out.
  type: look
  expect:
    location: The Landing (realized)
    exits:
    - The First Floor (stub)
    present:
    - Old Hesk
- id: onto-the-first-floor
  why: >-
    The floor is laid out on this turn. The stair lands on the entry, room 1,
    and the guard stands on the way down, never on the entry.
  type: "/move The First Floor"
  browser:
    token: onto-the-first-floor
    realizes: The First Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages lit by nothing you can see.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      content:
        description: A low chamber of black stone at the foot of the stair from the landing.
        lore: Delvers stop here to light their lanterns before going on.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 1 (realized)
    exits:
    - The First Floor room 2 (stub)
    - The Landing (realized)
    present: []
- type: "/move The First Floor room 2"
  browser:
    token: room-2
    realizes: The First Floor room 2
    replies:
    - {purpose: location, content: {description: A bare chamber of black stone., lore: Cut long ago by nobody remembered., items: [], people: []}}
    - {purpose: arrival, unavailable: true}
  expect:
    location: The First Floor room 2 (realized)
