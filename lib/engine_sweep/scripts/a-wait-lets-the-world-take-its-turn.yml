---
story: A Clerk With Somewhere To Be
why: >-
  Letting time pass is an act of its own: the `wait` every room offers,
  reached through `wait`, `rest`, `idle`, `think` and `pray`. It changes no
  thing, person or door. A told wait writes its scene with resolved_action
  `wait` and moves the clock one action's five minutes, and the world takes
  its turn after it as after any other line, so waiting for somebody to
  leave lets them leave.
steps:
- id: wait-by-the-counter
  why: >-
    Bell is due upstairs. Wick waits, and Bell's own turn after the wait
    walks her out to The Landing. The narrator is asked as for a line the
    engine does nothing with: no fact is handed to it.
  type: "/wait"
  browser:
    token: wait
    replies:
    - purpose: narration
      content: You stand by the counter and let the minutes go.
      prompt_excludes:
      - What has ALREADY happened
      - You let time pass
  expect:
    changed: true
    refused: false
    resolved_by: grammar
    volitions: 1
    acts: 1
    elapsed_minutes: 5.0
    present: []
    here:
    - quarter receipt
- id: rest-in-the-empty-office
  why: >-
    `rest` is the same act, and what follows the word does not change it.
    Five more minutes pass.
  type: "/rest a moment longer"
  browser:
    token: rest
    replies:
    - purpose: narration
      content: You lean on the counter a while longer.
  expect:
    changed: true
    refused: false
    volitions: 0
    elapsed_minutes: 5.0
- id: pray-in-the-empty-office
  why: >-
    Praying is the same as waiting. The prose-free console plays it and
    says so in the engine's words.
  type: "/pray for the rain to stop"
  expect:
    changed: true
    refused: false
- id: wait-and-take-is-two-acts
  why: A wait joined to a second act is refused, as any joined line is.
  type: "/wait and take the quarter receipt"
  expect:
    refused: true
