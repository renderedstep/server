# WHAT LIES INSIDE A SHUT PIECE, DRAWN ONCE FOR EVERY GAME.
#
# The clerk's desk is a closed fixture its world put nothing inside. A game
# holds nothing in it until it searches it: the first search by anybody draws
# what lies inside from the kit's table (`Roll::CONTENTS`, on the desk's own
# row) into the world, stamps the world's desk `searched_at`, and copies it
# into the game that searched. The records file pins those world rows written
# once, at the first search, and nowhere else. A piece is searched once a game,
# so a second search and an open are both refused.
#
# The coal scuttle is hollow: what lies in it was always in plain view, and a
# search finds it there without drawing anything. A second game walks in on
# the desk shut, and opening it finds what the first game found, copied from
# the same world rows. The stall's crate opens on nothing, and the market
# stall, a top with no inside, cannot be searched at all.
story: The Furnished Rooms
why: a closed piece's inside is drawn once, by the first search in any game, and copied by every game that searches it
steps:
- id: in-the-study
  type: look
  why: a game that has not searched the desk holds nothing in it
  expect:
    location: The Clerk's Study (realized)
    here: [desk, windowsill, coal scuttle, ward stamp, potted fern, lump of coal]
    changed: false
    refused: false

- id: the-shut-desk-holds-nothing-to-take-yet
  type: take the pen
  why: nothing has been drawn into the desk, so there is no pen to take
  expect:
    refused: true
    changed: false

- id: search-the-desk
  type: "/search desk"
  why: the first search draws the desk's inside into the world and copies it into this game
  expect:
    understood: use -> desk
    changed: true
    refused: false
    carrying: []
    here: [desk, windowsill, coal scuttle, ward stamp, potted fern, lump of coal, sheaf of papers, letter]

- id: the-desk-is-searched-once-a-game
  type: "/search desk"
  why: this game's desk is stamped searched, so no search is offered on it
  expect:
    refused: true
    changed: false

- id: and-cannot-be-opened-again
  type: "/open desk"
  why: a searched piece is no longer shut, so no open is offered on it either
  expect:
    refused: true
    changed: false

- id: the-scuttle-holds-what-it-held
  type: rummage coal scuttle
  why: a hollow piece's inside lies in plain view, so a search of it draws nothing new
  expect:
    understood: use -> coal scuttle
    changed: true
    here: [desk, windowsill, coal scuttle, ward stamp, potted fern, lump of coal, sheaf of papers, letter]

- id: the-letter-comes-out-of-the-drawer
  type: take the letter
  why: what a search found is this game's to take like anything lying here
  expect:
    understood: take -> letter
    changed: true
    carrying: [letter]

- id: a-second-game-finds-the-desk-shut
  type: look
  player: second
  why: a new game's copy of the desk starts unsearched, and holds nothing of its inside
  expect:
    here: [desk, windowsill, coal scuttle, ward stamp, potted fern, lump of coal]
    carrying: []

- id: and-opens-it-on-what-the-first-found
  type: "/open desk"
  player: second
  why: the world's desk is already drawn, so the second game copies the same two things and draws none
  expect:
    understood: use -> desk
    changed: true
    here: [desk, windowsill, coal scuttle, ward stamp, potted fern, lump of coal, sheaf of papers, letter]

- id: to-the-stall
  type: go to Cinder Lane Stall
  expect:
    changed: true
    location: Cinder Lane Stall (realized)
    carrying: [letter]

- id: open-the-crate
  type: "/open crate"
  why: the crate's inside is drawn on its own row, and here it holds nothing; the apple lies on the stall
  expect:
    understood: use -> crate
    changed: true
    here: [market stall, crate, apple]

- id: search-the-market-stall
  type: "/search market stall"
  why: a top has no inside, so nothing is offered to search on it
  expect:
    refused: true
    changed: false
