# A FLOOR FALLS BEHIND YOU, IN YOUR GAME ONLY. The First Floor says
# `minutes: 30`. Odile walks onto it, passes Wenna Cole at the head of the
# stair down, and goes on down to The Second Floor, which has no countdown.
# She waits there until the first floor's thirty minutes have run out. It
# falls in her game: she is not on it, so she lives, but the stair back up is
# no longer a way out, and naming it, or the floor, is refused in the
# engine's words. Wenna is dead in this game (`cast_in` leaves out everybody
# on a fallen floor), which the sweep cannot stand beside her to see. The
# world's rows are untouched, so a second game walks onto The First Floor
# whole and finds Wenna standing at the stair.
story: A Floor That Falls
steps:
- id: onto-the-first-floor
  why: >-
    The floor is laid out on this turn, and Wenna Cole is stood in the room
    with the stair down. This game's countdown on it starts as it is
    reached.
  type: "/move The First Floor"
  browser:
    token: into-the-first-floor
    realizes: The First Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages, cracked across every few paces.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      content:
        description: A low chamber at the foot of the stair, its floor split down the middle.
        lore: Delvers do not rest here long.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 1 (realized)
    dead: false
- id: to-the-way-down
  type: "/move The First Floor room 2"
  browser:
    token: first-floor-room-2
    realizes: The First Floor room 2
    replies:
    - purpose: location
      content:
        description: A bare chamber with a stair cut down into its floor.
        lore: The stair down is older than the rest.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 2 (realized)
    present:
    - Wenna Cole
    exits_include:
    - The Second Floor (stub)
- id: down-onto-the-second-floor
  why: >-
    The Second Floor has no countdown of its own.
  type: "/move The Second Floor"
  browser:
    token: into-the-second-floor
    realizes: The Second Floor
    replies:
    - purpose: location
      content:
        description: A colder level, the air still and the dark close.
        lore: Few delvers come this far.
        place_kind: warren
    - purpose: location
      content:
        description: The foot of the stair, cold and quiet.
        lore: The stair comes down here from the floor above.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Second Floor room 1 (realized)
    exits_include:
    - The First Floor room 2 (realized)
- id: wait-1
  type: "/wait"
  browser:
    token: wait-1
    replies:
    - purpose: narration
      content: You stand at the foot of the stair and listen.
  expect:
    elapsed_minutes: 5.0
    exits_include:
    - The First Floor room 2 (realized)
- id: wait-2
  type: "/wait"
  browser:
    token: wait-2
    replies:
    - purpose: narration
      content: Grit trickles down the stair from above.
  expect:
    elapsed_minutes: 5.0
- id: wait-3
  type: "/wait"
  browser:
    token: wait-3
    replies:
    - purpose: narration
      content: Something above you groans.
  expect:
    elapsed_minutes: 5.0
- id: wait-4
  type: "/wait"
  browser:
    token: wait-4
    replies:
    - purpose: narration
      content: Dust drifts down the stair.
  expect:
    elapsed_minutes: 5.0
- id: wait-5
  type: "/wait"
  browser:
    token: wait-5
    replies:
    - purpose: narration
      content: The groaning above grows louder.
  expect:
    elapsed_minutes: 5.0
    exits_include:
    - The First Floor room 2 (realized)
- id: the-first-floor-falls-above-her
  why: >-
    This wait carries the clock past the first floor's thirty minutes. It
    falls in this game: Odile, below it, lives, and the stair up is no
    longer a way out.
  type: "/wait"
  browser:
    token: wait-6
    replies:
    - purpose: narration
      content: A roar comes down the stair, and then nothing.
  expect:
    elapsed_minutes: 5.0
    dead: false
    exits_exclude:
    - The First Floor room 2
- id: there-is-no-way-back-up
  why: >-
    Naming the fallen floor's room is refused in the engine's own words.
  type: "/move The First Floor room 2"
  expect:
    refused: true
    offers: The First Floor has fallen. There is no way back onto it.
    location: The Second Floor room 1 (realized)
- id: nor-onto-the-floor-by-its-name
  type: "/move The First Floor"
  expect:
    refused: true
    offers: The First Floor has fallen. There is no way back onto it.
- id: a-second-game-finds-the-first-floor-whole
  why: >-
    The floor fell in Odile's first game only. Another game walks onto it
    from the landing, whole.
  player: second
  type: "/move The First Floor"
  expect:
    location: The First Floor room 1 (realized)
    dead: false
- id: and-wenna-is-alive-at-its-stair
  why: >-
    Wenna stands at the stair down in this game, and the stair leads on.
  player: second
  type: "/move The First Floor room 2"
  expect:
    location: The First Floor room 2 (realized)
    present:
    - Wenna Cole
    exits_include:
    - The Second Floor room 1 (realized)
