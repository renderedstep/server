# A THROW TYPED WITHOUT A SLASH IS POINTED AT THE COMMAND.
#
# `a-thing-can-be-thrown.yml` walks the fixed grammar, which reads a slashed or
# verb-first throw offline. A free line goes to the classifier's local reader
# (`PointerClassifierAgent`), and that reader has no word for a throw: asked,
# it read "throw the daybook at Halkett Rowe" as a drop, "hurl the daybook at
# Rowe" as an attack, and a toss through the door as a gift -- three wrong acts
# that change the game. So a free line that names a throw (the engine's
# `cascade::thrown`) is not read at all, and the player is told the command
# that does read one. (Before that, issue #202 was the classifier with no
# `throw` intent: "throw the access panel at the core" came back `other` and
# the panel stayed carried.)
#
#   * a free throw is refused with the sentence pointing at `/throw`, nothing
#     is asked, nothing is narrated, and the daybook stays in the hands;
#   * the same throw as the command is played by the grammar, down the same
#     write-before-prose path every throw takes. The ward stamp is lying in
#     this room and Halkett Rowe is standing in it, so whichever way the die
#     falls it is still lying in Ward Office 12 afterwards.
#
# Offline throughout: the narrator is a fixture, and the refusal, the branch
# and the rows are the real ones.
story: The Unrecorded Hour
why: a free-typed throw is refused with the command that reads one, and the command plays
steps:
- id: a-free-throw-is-pointed-at-the-command
  type: throw the daybook at the window
  why: no reader reads a throw right, so nothing is asked, nothing is thrown and nothing is narrated
  browser:
    token: free
    local_reader: true
  expect:
    refused: true
    changed: false
    offers: [/throw <thing> at <somebody here, or a way out>]
    carrying: [office coat, spectacles,Ward Office 12 daybook]

- id: the-command-is-played
  type: /throw ward stamp at Halkett Rowe
  why: both names resolve, so the engine throws before the narrator is asked for a word
  browser:
    token: at-rowe
    replies:
    - purpose: narration
      content: The stamp flies across the office.
  expect:
    resolved_by: grammar
    refused: false
    carrying: [office coat, spectacles,Ward Office 12 daybook]
