# THE WAYS A FREE-TYPED LINE CAN BE READ, walked in one game.
#
# Every other script in this directory types a slashed or verb-first line, which
# the fixed grammar answers offline -- so nothing here walked the reader of a
# free line at all. Play reads every free-typed line through the classifier's
# local reader, the small pointer model (`PointerClassifierAgent`), and through
# nothing else: the model call is never made for one. A step that declares a
# `local_classifier` reply is that reader answering. So this script is one
# game in one room, typing four lines, each read a different way:
#
#   typed_model           the reader was sure, and the line was played on its
#                         reading
#   typed_model_unsure    the two-name flag read high, and the line was played
#                         on the reader's own reading all the same: no second
#                         reader is asked
#   a throw               a free-typed throw is not read at all and is pointed
#                         at `/throw`; nothing is asked
#   the reader down       the line is refused with a pointer to the slash
#                         commands, never handed to a model call instead
#
# A refused line writes no scene, so the last two are asserted by the sentence
# the player is shown.
#
# Offline throughout: the reader and the narrator are fixtures, and the
# composition, the resolution, the branch and the row that moves are the real
# ones.
story: A Turn at the Gate
steps:
- id: a-sure-reading-is-played
  why: Neither flag fires, so the reader's answer is the turn's.
  type: pick up that red coin
  browser:
    token: sure
    replies:
    - purpose: local_classifier
      prompt_includes: [red coin, pick up that red coin]
      content:
        intent: take
        target_take: available_item_1
        named_more_than_one: 0.02
        target_present: 0.95
    - purpose: narration
      content: You stoop and close your hand around the coin.
  expect:
    carrying: [red coin]
    here: []
    resolved_by: typed_model
    changed: true
    refused: false

- id: an-unsure-reading-is-played-on-its-own
  why: >-
    The two-name flag reads high and `also_named` resolves to nothing. Where a
    second reader once answered, the line is now played as the reader read it,
    and the path says so.
  type: put down the coin and the key
  browser:
    token: unsure
    replies:
    - purpose: local_classifier
      content:
        intent: drop
        target_drop: player_item_1
        also_named: nothing
        named_more_than_one: 0.91
        target_present: 0.9
    - purpose: narration
      content: You set the coin down and keep your hands to yourself.
  expect:
    carrying: []
    here: [red coin]
    resolved_by: typed_model_unsure
    changed: true
    refused: false

- id: a-free-throw-is-pointed-at-the-command
  why: No reader reads a throw right, so the reader is not asked and the player is told how to throw.
  type: throw the coin at Maren
  browser:
    token: throw
    local_reader: true
  expect:
    refused: true
    changed: false
    offers: [/throw <thing> at <somebody here, or a way out>]
    here: [red coin]

- id: a-reader-that-is-down-refuses-the-line
  why: >-
    A down reader is not a reading, and no second reader stands behind it: the
    line is refused with a pointer to the slash commands.
  type: pick the coin up again
  browser:
    token: down
    replies:
    - purpose: local_classifier
      unavailable: true
  expect:
    refused: true
    changed: false
    offers: [the slash menu lists them]
    here: [red coin]
