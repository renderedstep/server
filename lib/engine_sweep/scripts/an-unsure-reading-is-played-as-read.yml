# AN UNSURE READING IS PLAYED AS READ, AND AN ABSENT ONE IS REFUSED WITH WHAT IS HERE.
#
# Play reads a free-typed line through the classifier's local reader and
# nothing else (`PointerClassifierAgent`). When the reader is unsure -- its
# two-name flag high, or its "is it here?" reading low -- no second reader is
# asked any more: the engine plays the reader's own reading
# (`typed_model_unsure`), because on the lines it was unsure of that reading
# was measured right far more often than a refusal would have been. Its
# "is it here?" reading still gates the target, so a line whose target it
# reads as absent is refused, and the refusal lists what is here: the owner's
# ruling of 2026-09-04, "if we can't determine what they are trying to do ...
# refuse and ask for clarification".
#
# WHAT EACH STEP IS FOR:
#
#   1  "ask Tamsin about Rowe": both names are in the line, so the two-name
#      flag reads high. The reader's own reading is one talk to Tamsin (the
#      owner's ruling of 2026-10-22: a person only talked about is not a
#      second act), and that is what is played.
#   2  A line about somebody who is not here: the reader reads the target as
#      absent, and the line is refused with the people who are.
#
# WHAT IS DELIBERATELY NOT ASSERTED: that the model reads these lines this way.
# That is the classifier bench's question (`rake eval:classifier`), never a
# walk's.
story: Two Clerks at One Counter
steps:
- id: an-unsure-talk-is-played-as-read
  type: ask Tamsin about Rowe
  why: the two-name flag is high, and the reader's own reading -- one talk to Tamsin -- is what plays
  browser:
    token: unsure-about
    replies:
    - purpose: local_classifier
      prompt_includes: [ask Tamsin about Rowe, Tamsin Gale, Rowe Harker]
      content:
        intent: talk
        target_talk: person_1
        also_named: nothing
        named_more_than_one: 0.62
        target_present: 0.93
    - purpose: character
      prompt_includes: [ask Tamsin about Rowe]
      content:
        pre_thought: He wants to know about Rowe, with Rowe standing right there.
        pre_feeling: wary
        action: Tamsin glances at Rowe and lowers her voice.
        post_thought: Better he hears it from me than from the book.
        post_feeling: careful
        inner_resolution: I will tell him Rowe keeps the pledges.
        engine_action: none
    - purpose: interaction-narration
      content: Tamsin glances sideways at Rowe before she answers you, low.
  expect:
    changed: true
    refused: false
    understood: talk -> Tamsin Gale
    resolved_by: typed_model_unsure
    present: [Rowe Harker, Tamsin Gale]

- id: an-absent-target-is-refused-with-what-is-here
  type: ask the night porter where the watch went
  why: the reader reads the target as absent, so nothing is played and the player is shown who is here
  browser:
    token: absent
    replies:
    - purpose: local_classifier
      content:
        intent: talk
        target_talk: person_1
        named_more_than_one: 0.01
        target_present: 0.04
  expect:
    refused: true
    changed: false
    offers: [Tamsin Gale, Rowe Harker]
    present: [Rowe Harker, Tamsin Gale]
