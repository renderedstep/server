# A FLOOR RAISES A LEVEL ONCE A GAME. Every floor of the world says
# `levels_up: true`. The first time a game stands on one, the engine writes
# that game's row for the floor (`playthrough_floors`) at one level past the
# level the game had, and heals the player to full before anybody in the room
# strikes. Odile starts at level 3 on a d8: 18 hit points. Reaching The First
# Floor raises her to level 4 (23), and The Second Floor to level 5 (28).
#
# She is hurt before each first arrival, so the hit points she arrives with
# are the new maximum, and `harm`'s read-out says what that maximum is. Then
# she walks back up onto The First Floor and down onto The Second again: each
# floor was reached already, so neither heals her nor raises her, and she
# keeps level 5, not the level the floor she stands on gave. A second game
# reaches The First Floor from the world's level 3 and is raised to 4: the
# level is the game's, never the world's.
story: Three Floors That Raise You
steps:
- id: hurt-on-the-landing
  why: >-
    At the world's level 3 on a d8, Odile can take 18 hit points.
  type: harm 5
  expect:
    change: Odile unhurt -> hurt (13 of 18)
    hp: 13
- id: the-first-floor-raises-her-to-level-four
  why: >-
    The floor is laid out on this turn, and reaching it raises her to level 4
    and heals her to full: 23 hit points, the most a level 4 body on a d8 can
    take.
  type: "/move The First Floor"
  browser:
    token: into-the-first-floor
    realizes: The First Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages lit by nothing you can see.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      content:
        description: A low chamber at the foot of the stair.
        lore: Delvers rest here before going on.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 1 (realized)
    hp: 23
- id: level-four-takes-twenty-three
  why: >-
    The read-out says it against the game's maximum, not the world's 18.
  type: harm 3
  expect:
    change: Odile unhurt -> hurt (20 of 23)
    hp: 20
- id: to-the-way-down
  why: >-
    The other room of the same floor: reaching a room of a floor already
    reached raises nothing and heals nothing.
  type: "/move The First Floor room 2"
  browser:
    token: first-floor-room-2
    realizes: The First Floor room 2
    replies:
    - purpose: location
      content:
        description: A bare chamber with a stair cut down into its floor.
        lore: The stair down is older than the rest.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The First Floor room 2 (realized)
    exits_include:
    - The Second Floor (stub)
    hp: 20
- id: the-second-floor-raises-her-to-level-five
  why: >-
    One past the level this game had: level 5, healed to full at 28.
  type: "/move The Second Floor"
  browser:
    token: into-the-second-floor
    realizes: The Second Floor
    replies:
    - purpose: location
      content:
        description: A colder level, the air still and the dark close.
        lore: Few delvers come this far.
        place_kind: warren
    - purpose: location
      content:
        description: The foot of the stair, cold and quiet.
        lore: The stair comes down here from the floor above.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Second Floor room 1 (realized)
    hp: 28
- id: level-five-takes-twenty-eight
  type: harm 4
  expect:
    change: Odile unhurt -> hurt (24 of 28)
    hp: 24
- id: back-up-onto-the-first-floor
  why: >-
    The First Floor was reached already in this game, so walking back onto it
    heals nothing.
  type: "/move The First Floor room 2"
  expect:
    location: The First Floor room 2 (realized)
    hp: 24
- id: she-keeps-level-five-on-the-first-floor
  why: >-
    The level is the highest this game has reached, wherever she stands: 28,
    not the first floor's 23.
  type: harm 1
  expect:
    change: Odile hurt (24 of 28) -> hurt (23 of 28)
    hp: 23
- id: down-onto-the-second-floor-again
  why: >-
    Reaching The Second Floor a second time raises nothing and heals nothing.
  type: "/move The Second Floor room 1"
  expect:
    location: The Second Floor room 1 (realized)
    hp: 23
- id: still-level-five
  why: >-
    A mend stops at level 5's 28, not at a level 6 nobody reached.
  type: mend 99
  expect:
    change: Odile hurt (23 of 28) -> unhurt
    hp: 28
- id: a-second-game-is-raised-from-the-worlds-level
  why: >-
    Another game reaches The First Floor, already laid out, for the first time:
    it is raised from the world's level 3 to 4, and the engine says so in its
    own words.
  player: second
  type: "/move The First Floor"
  expect:
    location: The First Floor room 1 (realized)
    hp: 23
    note: 'the game: Reaching The First Floor raised Odile to level 4: 23 hit
      points, and healed to full.'
