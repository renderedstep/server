# A LOCKED STAIR ONTO A PLACE KEEPS ITS LOCK, ITS KEY, ITS ONE-WAY DROP AND THE
# OPENING A GAME MADE THROUGH IT WHEN THE PLACE IS LAID OUT.
#
# The Old Cellar is an ordinary place (a footprint and no rooms; no `floor:`),
# and the stair onto it from the landing is keyed with the cellar key and drops
# you on the way down only (`hazard_from: The Landing`). Laying the cellar out
# moves the stair off the place onto its entry room (`#open_the_way_in!`).
# Before this, the moved stair kept only its distance and travel method: the
# lock, the key and the drop were lost, and so was the opening this game had
# already made. Now the moved stair carries all of them, each on its own side.
#
# A second game finds the stair still locked: the opening was the first
# game's.
story: Two Floors and a Key
steps:
- id: take-the-cellar-key
  type: "/take cellar key"
  expect:
    location: The Landing (realized)
    carrying: [cellar key]
- id: the-cellar-stair-is-locked
  type: "/move The Old Cellar"
  expect:
    location: The Landing (realized)
    refused: true
    offers: locked
    changed: false
- id: the-cellar-key-opens-it
  type: "/unlock The Old Cellar with cellar key"
  why: the opening is made on the stair as it is now, onto the place itself
  expect:
    location: The Landing (realized)
    changed: true
    refused: false
- id: down-into-the-cellar
  type: "/move The Old Cellar"
  why: the cellar is laid out and the stair moved onto its entry, keeping this game's opening, and the drop is paid on the way down
  browser:
    token: into-the-cellar
    realizes: The Old Cellar
    replies:
    - purpose: location
      content:
        description: A low vaulted cellar, damp and close.
        lore: The cellar was dug before the landing was built.
        place_kind: house
    - purpose: location
      content:
        description: The foot of the narrow stair, its last step gone.
        lore: The bottom step broke long ago.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Old Cellar room 1 (realized)
    exits_include:
    - The Landing (realized)
    hazards: 1
    refused: false
- id: climbing-back-up-is-free
  type: "/move The Landing"
  why: the drop is on the landing's side only, and the opening holds both ways
  expect:
    location: The Landing (realized)
    hazards: 0
    refused: false
- id: and-down-again-drops-again
  type: "/move The Old Cellar room 1"
  why: the opening still holds on the moved stair, and so does the drop
  expect:
    location: The Old Cellar room 1 (realized)
    hazards: 1
    refused: false
- id: a-second-game-finds-it-locked
  player: second
  type: "/move The Old Cellar room 1"
  why: the moved stair kept its lock for everybody who has not opened it
  expect:
    location: The Landing (realized)
    refused: true
    offers: locked
    changed: false
