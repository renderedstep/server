# A FLOOR IS STOCKED ONCE, WHEN IT IS LAID OUT. The Stocked Floor says
# `safe_rooms: 1` and leaves two red draughts (`healing: count: 2`). Its
# layout, on the first step onto it, rolls them into its rooms off the place's
# own dice, after every other draw: the entry, room 1, gets neither; room 4 is
# made the safe room and room 2 and room 4 each get a draught. They are the
# world's own rows, written with the floor and never again: a second game
# walks the same floor and finds the same two, and nothing new. Each room is
# still furnished from its sort as it is first written, and a draught leaves
# the room writer its whole allowance of three things.
story: A Stocked Floor
steps:
- id: onto-the-stocked-floor
  why: >-
    The floor is laid out on this turn and its supplies written with it. The
    entry is never stocked: the room writer is told of no draught lying
    here, and the room holds only its kit.
  type: "/move The Stocked Floor"
  browser:
    token: into-the-stocked-floor
    realizes: The Stocked Floor
    replies:
    - purpose: location
      content:
        description: A level of black stone passages.
        lore: The first floor was cut by people nobody remembers.
        place_kind: warren
    - purpose: location
      prompt_excludes:
      - 'Loose, and could be picked up: red draught'
      content:
        description: A low chamber of black stone at the foot of the stair.
        lore: Delvers pass through here on their way in.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Stocked Floor room 1 (realized)
    here:
    - coin
    - rock shelf
    - rubble
    - stalagmite
- id: a-room-with-a-draught-and-its-kit
  why: >-
    Room 2 holds a draught and is still furnished from its sort. The room
    writer is told of the draught through Already Here, as of any loose
    thing, and is still offered three things of its own, all three of which
    are admitted.
  type: "/move The Stocked Floor room 2"
  browser:
    token: stocked-floor-room-2
    realizes: The Stocked Floor room 2
    replies:
    - purpose: location
      prompt_includes:
      - 'Loose, and could be picked up: red draught.'
      - List AT MOST 3 portable things
      content:
        description: A cramped chamber, a rock shelf along one wall and rubble heaped in a corner.
        lore: Somebody sheltered here once.
        items:
        - name: tallow candle
          description: A stub of yellow tallow candle, its wick black.
          use_kind: ordinary
        - name: coil of twine
          description: A coil of waxed twine, still tight.
          use_kind: ordinary
        - name: chalk stick
          description: A stick of white chalk worn down at one end.
          use_kind: ordinary
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Stocked Floor room 2 (realized)
    here:
    - chalk stick
    - coil of twine
    - red draught
    - rock shelf
    - rubble
    - shard of pottery
    - tallow candle
- id: take-the-draught
  why: >-
    The first game takes its own copy of the draught. The world's row stays
    where the layout left it.
  type: "/take red draught"
  expect:
    carrying:
    - red draught
- id: a-room-with-nothing-left-in-it
  type: "/move The Stocked Floor room 3"
  browser:
    token: stocked-floor-room-3
    realizes: The Stocked Floor room 3
    replies:
    - purpose: location
      prompt_excludes:
      - 'Loose, and could be picked up: red draught'
      content:
        description: A long chamber where a ledge runs above a stalagmite.
        lore: Bats roost here.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Stocked Floor room 3 (realized)
    here:
    - bat skull
    - bone
    - ledge
    - rock shelf
    - stalagmite
- id: the-safe-room
  why: >-
    Room 4 is the safe room: nobody is born in it, so the room writer is given
    the existing nobody-here instruction, and it holds the other draught.
    Nothing tells the room writer it is safe.
  type: "/move The Stocked Floor room 4"
  browser:
    token: stocked-floor-room-4
    realizes: The Stocked Floor room 4
    replies:
    - purpose: location
      prompt_includes:
      - 'Loose, and could be picked up: red draught'
      - Write NOBODY into this place.
      prompt_excludes:
      - safe room
      - sanctuary
      content:
        description: A still chamber around a dark pool, the air quiet.
        lore: Nothing comes in here.
        items: []
        people: []
    - purpose: arrival
      unavailable: true
  expect:
    location: The Stocked Floor room 4 (realized)
    present: []
    here:
    - bone
    - coin
    - crack
    - pool
    - red draught
    - rubble
    - stalagmite
- id: a-second-game-finds-the-floor-as-it-was-stocked
  why: >-
    The floor is not laid out or stocked again: the second game finds room 2
    as the layout left it, its draught still lying there, and only one.
  player: second
  type: "/move The Stocked Floor"
  expect:
    location: The Stocked Floor room 1 (realized)
    here:
    - coin
    - rock shelf
    - rubble
    - stalagmite
- id: and-the-draught-the-first-game-took
  player: second
  type: "/move The Stocked Floor room 2"
  expect:
    location: The Stocked Floor room 2 (realized)
    carrying: []
    here:
    - chalk stick
    - coil of twine
    - red draught
    - rock shelf
    - rubble
    - shard of pottery
    - tallow candle
