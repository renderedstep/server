# THE GREEN AT SALTMARSH: The Ropewalk at Saltmarsh, with its green laid out.
#
# The same village as `the-ropewalk-at-saltmarsh.yml`, row for row, but for
# three things: the title, the green's box, and Wat Coyle's spot on it. The
# green stands on its own (no parent), so its box is its own plane: at the
# origin, 0, 0 on storey 0, 20 paces west to east and 30 north to south
# (`Location::Box`'s ruling for a room that stands on its own). Its size is
# written here by hand, as a handmade world's would be; a generated room is
# sized from its sort's band instead (the engine's `data/location/size.yml`).
#
# Its one way out, to the ropewalk, leaves by a side of the green the engine
# rolls on the doorway's own row every time it reads it, and never keeps; a
# throw at the way out is held against the paces to the middle of that side,
# and one more through it, as a throw at a door inside a building is.
#
# A THROW'S RANGE IS ITS BULK'S PACES AT THE WORLD'S GRAVITY, plus the
# thrower's reach for strength over 10 (the Rust engine's `data/physics.yml`).
# `universe.gravity: ordinary` is what gives a throw a range at all; a world
# with no gravity throws exactly as it did before ranges.
#
# Jory Pask comes in with one thing of each bulk a script needs:
#
#   lead sinker     heavy, and it carries the shortest way
#   hank of twine   handy
#   cork float      light, and sturdy
#   tar pot         light, and brittle, so where it lands it may break
#
# Hester Vane keeps a spot of her own at the far end of the ropewalk (x 18,
# y 1), so a throw at her is held against the paces between her and wherever
# Jory stands. Jory has no spot: a player never keeps one, and stands where the
# placement roll puts them for this game at this moment. Wat Coyle keeps a spot
# near the green's south edge (x 10, y 27), so a throw at him is measured too.
#
# Every room is written, so moving between them asks nobody to write one. The
# green is the opening, and the first room in the file, because a walk starts
# in the lowest-id written room.
#
# Loaded offline by the sweep. No model call, no API key, no network.
---
format: 2
universe:
  physics: Ordinary physics. What is thrown comes down, and the heavier it is the sooner.
  technology: Hemp, tar, a spinning wheel and a long shed to lay the rope in.
  weapons: A marlinspike, at a pinch.
  geographies: A salt marsh on a tidal river, with the village on the only dry ground.
  civilizations: A fishing village that makes its own rope and sells the rest.
  history: The Coyles have laid the village's rope since the harbour was dug.
  economics: Rope by the fathom to the boats, and nets by the dozen to the market.
  politics: The harbour master, who buys the rope and sets its price.
  religion: A blessing of the boats at midsummer.
  races:
  - name: Marshfolk
    description: |-
      Born on the marsh, and never quite dry.
  gravity: ordinary
