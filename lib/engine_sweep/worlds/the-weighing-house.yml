# THE WEIGHING HOUSE: the one world whose carrying is limited.
#
# `universe.carrying: limited` is what turns the rule on (the Rust engine's
# `carry.rs` and the `carry` table in its `data/physics.yml`): a thing takes
# hands by its bulk (light and handy one, heavy both), a bare body keeps two
# light things about the person, and a body bears its strength over two, where
# light weighs 0, handy 1 and heavy 4. No die is thrown over any of it. A world
# with no `carrying` plays exactly as it did before.
#
# Nell Fisk is the weak body: strength 5, so she bears 2. She comes in with
# the tally board, a handy thing, in one hand. She can hold one more handy
# thing and no third (the load), keep two of the coins at the market cross
# about her and no third while both hands are full (the hands), and cannot
# lift the market slate at all (heavy, weight 4), to take or to throw. No room
# holds more than three of the world's own things.
#
# Bram Hale is the strong body: strength 16. He holds the yoke, a heavy thing
# that takes both hands, and a weigh ticket. A give is offered only of what
# would fit the player, so he can hand her the ticket and never the yoke.
# Nobody here has a pursuit, so nobody acts on volition's die and the room
# stays as each step leaves it.
#
# Loaded offline by the sweep. No model call, no API key, no network.
---
format: 2
universe:
  physics: Ordinary physics. What is heavy is heavy for anybody.
  technology: Beams, scales, brass weights and stamped tickets.
  weapons: A porter's staff.
  geographies: A market town on a river crossing.
  civilizations: A town that weighs everything sold in it.
  history: The weighing house was built when the market outgrew honest guesses.
  economics: Goods by the stone, paid in copper and silver.
  politics: The market warden, who keeps the weights true.
  religion: A blessing of the scales on market day.
  races:
  - name: Townsfolk
    description: |-
      Market people, who can tell a short weight by the look of it.
  carrying: limited
