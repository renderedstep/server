# A floor stocked when it is laid out. The Stocked Floor is a FLOOR, laid out
# by the engine the first time anybody walks into it, as four rooms. Its
# `safe_rooms: 1` makes one of them, never the entry, a safe room: safe, no
# hazard, nobody born in it (`population: nobody`) and `sanctuary` set. Its
# `healing:` block leaves two red draughts lying in two rooms, never the
# entry, as the world's own rows: they carry the supply marker and no
# `kit_key`, so the room is still furnished from its sort and neither the
# room's three-thing allowance nor the story's thing limit counts them. The
# layout is written once, for the world: no later turn of any game stocks
# the floor again.
format: 2
universe:
  physics: Ordinary physics.
  technology: Lanterns, iron keys and hand tools.
  weapons: Short blades and cudgels.
  geographies: A dungeon cut down into black stone under a lantern-lit landing.
  civilizations: Delvers who sell what they bring up.
  history: The dungeon was cut long ago by people nobody remembers.
  economics: Coin for what comes up from below.
  politics: Nobody governs the dungeon.
  religion: Delvers leave a coin on the landing for luck.
  races:
  - name: Delvers
    description: People who go down into the dungeon for a living.
