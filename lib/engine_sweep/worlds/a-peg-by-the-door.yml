# THINGS A PERSON COULD WEAR, AND NO WAY YET TO WEAR THEM.
#
# The classifier bench's position for lines that put clothes on and take them
# off. The game has no worn state and offers no attempt to wear or remove a
# thing, so every such line is labelled a reach for an act nobody offered; the
# world is here so the lines have real records to be read against. A coat and
# a scarf are in the hands, a cap and an apron lie by the door beside a bell
# that is not clothing, and one person stands here to receive an offer -- the
# wrong action a dress line is most at risk of becoming.
