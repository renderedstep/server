# Three floors, one under another, and each of them raises a level. They are
# FLOORS, laid out by the engine the first time anybody walks into them, and
# each says `levels_up: true`: the first time a game stands on one, the engine
# writes that game's row for it (`playthrough_floors`) at one level past the
# level the game had, and heals the player to full before anybody there
# strikes. It is the game's level, not the world's: Odile's own row stays at
# level 3, and a second game starts from there. A floor raises a level once a
# game; walking back onto it raises nothing.
format: 2
universe:
  physics: Ordinary physics.
  technology: Lanterns, iron keys and hand tools.
  weapons: Short blades and cudgels.
  geographies: A dungeon cut down into black stone under a lantern-lit landing.
  civilizations: Delvers who sell what they bring up.
  history: The dungeon was cut long ago by people nobody remembers.
  economics: Coin for what comes up from below.
  politics: Nobody governs the dungeon.
  religion: Delvers leave a coin on the landing for luck.
  races:
  - name: Delvers
    description: People who go down into the dungeon for a living.
story:
  title: Three Floors That Raise You
  genre: dungeon crawl
  start_time: '2026-10-31T08:00:00Z'
  preface: Every floor a delver reaches leaves them harder to kill.
  summary: Odile goes down two floors and climbs back up one.
opening_scene:
  location: The Landing
  characters: [Odile]
  description: You stand on the lantern-lit landing above the first floor.
  summary: Odile reaches the landing.
characters:
- fullname: Odile
  nickname: Odile
  race: Delvers
  age: 29
  sex: female
  is_protagonist: true
  is_companion: false
  backstory: A delver who has never been below the first floor.
  personality: Careful and stubborn.
  appearance: A lantern on a pole and a short blade.
  likes: A clear way back.
  dislikes: Doors she cannot open.
  fears: The dark below the first floor.
  stats: {level: 3, hit_die: 8, strength: 14, dexterity: 12, will: 12}
locations:
- name: The Landing
  detail_level: realized
  population: nobody
  opening: true
  description: A square landing of black stone lit by one lantern, a stair going down from it.
  teaser: A lantern-lit landing.
  lore: Delvers gather here before they go down.
- name: The First Floor
  detail_level: stub
  kind: warren
  teaser: The first level of the dungeon, with a stair somewhere that goes further down.
  floor:
    rooms: 2
    danger: safe
    hazard: none
    down: The Second Floor
    levels_up: true
- name: The Second Floor
  detail_level: stub
  kind: warren
  teaser: The second level of the dungeon, colder than the first.
  floor:
    rooms: 2
    danger: safe
    hazard: none
    down: The Third Floor
    levels_up: true
- name: The Third Floor
  detail_level: stub
  kind: warren
  teaser: The third level of the dungeon, where the stair ends.
  floor:
    rooms: 2
    danger: safe
    hazard: none
    levels_up: true
connections:
- between: [The Landing, The First Floor]
  distance: adjacent
  travel_method: taking stairs
- between: [The First Floor, The Second Floor]
  distance: adjacent
  travel_method: taking stairs
- between: [The Second Floor, The Third Floor]
  distance: adjacent
  travel_method: taking stairs
