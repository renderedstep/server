  personality: Careful and stubborn.
  appearance: A lantern on a pole and a coil of rope.
  likes: A clear way back.
  dislikes: Doors she cannot open.
  fears: The dark below the first floor.
  stats: {level: 3, hit_die: 8, strength: 12, dexterity: 12, will: 12}
