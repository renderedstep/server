# THINGS TO SET DOWN SOMEWHERE, AND PLACES IN A ROOM TO WALK TO.
#
# The classifier bench's position for lines that put a carried thing on, in or
# by another thing, and for lines that walk to or back from something inside
# the room. The game offers no such act yet -- a thing is only ever dropped at
# the player's feet, and a move only ever leaves by a way out -- so every such
# line is labelled a reach for an act nobody offered; the world is here so the
# lines have real records to be read against. It is the room the design probe
# used: a desk, a shut chest, a hearth, a windowsill and a row of hooks to put
# things on or in or walk to, a lamp and a cap loose beside them, a coat, a
# bell and a key in the hands, two ways out whose names a walk across the room
# could be mistaken for, and one person to walk to, back away from and offer
# things to.
