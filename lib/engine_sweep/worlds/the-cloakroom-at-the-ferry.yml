# THINGS PUT ON AND TAKEN OFF, ONE ACT AT A TIME.
#
# The first world anybody in it is dressed, for the walks of `/wear` and
# `/remove`. Wren comes in wearing an oilskin coat over nothing she has put
# on yet, with a linen shirt and a wool scarf in her hands: the shirt goes on
# the body, which lies under the coat, so it waits for the coat to come off.
# A flat cap and a felt hat lie by the door, both worn on the head, so one
# taken up from the floor leaves no room for the other, and a hand-bell beside
# them is no clothing at all. Abel Moss, the ferryman, wears a pair of leather
# gloves and holds a brass token; when he dies both spill to the floor.
