# Two floors off one landing, an upper one and a bottom one. Both are FLOORS of
# one room, laid out by the engine the first time anybody walks in. The Bottom
# Floor's `monster_level: 4` is the level of everybody the engine births on it:
# the person its room writer writes there is born at level 4, their hit die and
# abilities still rolled as anybody's are. The Upper Floor names no level, so
# the person born there is born at the ordinary level 1.
format: 2
universe:
  physics: Ordinary physics.
  technology: Lanterns, iron keys and hand tools.
  weapons: Short blades and cudgels.
  geographies: A dungeon cut down into black stone under a lantern-lit landing.
  civilizations: Delvers who sell what they bring up.
  history: The dungeon was cut long ago by people nobody remembers.
  economics: Coin for what comes up from below.
  politics: Nobody governs the dungeon.
  religion: Delvers leave a coin on the landing for luck.
  races:
  - name: Delvers
    description: People who go down into the dungeon for a living.
story:
  title: A Deeper Floor
  genre: dungeon crawl
  start_time: '2026-10-30T08:00:00Z'
  preface: The deeper you go, the harder what lives there.
  summary: Odile looks into an upper floor and the bottom one.
opening_scene:
  location: The Landing
  characters: [Odile]
  description: You stand on the lantern-lit landing between two stairs down.
  summary: Odile reaches the landing.
characters:
- fullname: Odile
  nickname: Odile
  race: Delvers
  age: 29
  sex: female
  is_protagonist: true
  is_companion: false
  backstory: A delver who has never been below the first floor.
  personality: Careful and stubborn.
  appearance: A lantern on a pole and a short blade.
  likes: A clear way back.
  dislikes: Doors she cannot open.
  fears: The dark below the first floor.
  stats: {level: 3, hit_die: 8, strength: 12, dexterity: 12, will: 12}
locations:
- name: The Landing
  detail_level: realized
  population: nobody
  opening: true
  description: A square landing of black stone lit by one lantern, a stair going down on either side.
  teaser: A lantern-lit landing.
  lore: Delvers gather here before they go down.
- name: The Upper Floor
  detail_level: stub
  kind: warren
  teaser: The upper level of the dungeon, one chamber deep.
  floor:
    rooms: 1
    danger: uneasy
    hazard: none
- name: The Bottom Floor
  detail_level: stub
  kind: warren
  teaser: The bottom level of the dungeon, one chamber deep.
  floor:
    rooms: 1
    danger: uneasy
    hazard: none
    monster_level: 4
connections:
- between: [The Landing, The Upper Floor]
  distance: adjacent
  travel_method: taking stairs
- between: [The Landing, The Bottom Floor]
  distance: adjacent
  travel_method: taking stairs
