# THE WORDS A GENERATED ROOM IS BUILT FROM, read by
# `Eval::Classifier::Pointer::Worlds` (which writes the rooms) and by
# `script/pointer_classifier/templates.py` (which writes the lines typed in
# them, and names things that are NOT in the room).
#
# NONE OF THESE NAMES COMES FROM THE THREE SEEDED WORLDS the classifier corpus
# is staged in, deliberately: the corpus is the yardstick, and a model trained
# on its own rooms' names would be measured on what it memorised. That covers
# the common nouns their things are named with, not only proper names --
# `Eval::Classifier::PointerTest` checks both against those three seed files.
